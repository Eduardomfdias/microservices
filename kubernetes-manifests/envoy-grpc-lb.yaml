# =============================================================================
# ASID 2025/2026 — Cenário C5 — Envoy L7 gRPC Load Balancer
# Central proxy para per-request load balancing de tráfego gRPC interno.
# Resolve H6: connection affinity gRPC/HTTP2 em Kubernetes ClusterIP.
#
# Estratégia:
#   1. Headless Services expõem IPs individuais dos pods ao DNS
#   2. Envoy resolve headless DNS → lista de IPs por pod
#   3. LEAST_REQUEST distribui por pedido (não por conexão)
#   4. Callers (frontend, checkoutservice, recommendationservice) apontam
#      para envoy-grpc-lb:<porta> em vez de <service>:<porta>
#
# Listeners Envoy (porta → backend):
#   3550  → productcatalogservice (container :3550)
#   5000  → emailservice          (container :8080, K8s svc mapeia 5000→8080)
#   5050  → checkoutservice       (container :5050)
#   7000  → currencyservice       (container :7000)
#   7070  → cartservice           (container :7070)
#   8080  → recommendationservice (container :8080)
#   9555  → adservice             (container :9555)
#   50051 → shippingservice       (container :50051)
#   50052 → paymentservice        (container :50051 — porta distinta p/ evitar colisão)
#   9901  → admin Envoy (métricas, health, /clusters, /stats)
# =============================================================================

# --- Headless Services (clusterIP: None) ------------------------------------
# O DNS retorna um A record por pod em vez do ClusterIP.
# O Envoy faz STRICT_DNS sobre estes hostnames e obtém os IPs individuais.
# ----------------------------------------------------------------------------
---
apiVersion: v1
kind: Service
metadata:
  name: productcatalogservice-headless
  namespace: default
  labels:
    app: productcatalogservice
    role: headless-lb
spec:
  clusterIP: None
  selector:
    app: productcatalogservice
  ports:
  - name: grpc
    port: 3550
    targetPort: 3550
