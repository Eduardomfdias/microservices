# --- ConfigMap: envoy.yaml --------------------------------------------------
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-grpc-lb-config
  namespace: default
  labels:
    app: envoy-grpc-lb
    scenario: c5
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901

    static_resources:

      listeners:

      - name: productcatalogservice_listener
        address:
          socket_address: { address: 0.0.0.0, port_value: 3550 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: productcatalogservice
              codec_type: AUTO
              route_config:
                name: productcatalogservice_route
                virtual_hosts:
                - name: productcatalogservice
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    route:
                      cluster: productcatalogservice_cluster
                      timeout: 10s
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      - name: cartservice_listener
        address:
          socket_address: { address: 0.0.0.0, port_value: 7070 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: cartservice
              codec_type: AUTO
              route_config:
                name: cartservice_route
                virtual_hosts:
                - name: cartservice
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    route:
                      cluster: cartservice_cluster
                      timeout: 10s
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      - name: checkoutservice_listener
        address:
          socket_address: { address: 0.0.0.0, port_value: 5050 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: checkoutservice
              codec_type: AUTO
              route_config:
                name: checkoutservice_route
                virtual_hosts:
                - name: checkoutservice
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    route:
                      cluster: checkoutservice_cluster
                      timeout: 30s
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      - name: currencyservice_listener
        address:
          socket_address: { address: 0.0.0.0, port_value: 7000 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: currencyservice
              codec_type: AUTO
              route_config:
                name: currencyservice_route
                virtual_hosts:
                - name: currencyservice
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    route:
                      cluster: currencyservice_cluster
                      timeout: 10s
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      # shippingservice: porta 50051
      - name: shippingservice_listener
        address:
          socket_address: { address: 0.0.0.0, port_value: 50051 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: shippingservice
              codec_type: AUTO
              route_config:
                name: shippingservice_route
                virtual_hosts:
                - name: shippingservice
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    route:
                      cluster: shippingservice_cluster
                      timeout: 10s
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      # paymentservice: porta 50052 (evita colisão com shippingservice :50051)
      - name: paymentservice_listener
        address:
          socket_address: { address: 0.0.0.0, port_value: 50052 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: paymentservice
              codec_type: AUTO
              route_config:
                name: paymentservice_route
                virtual_hosts:
                - name: paymentservice
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    route:
                      cluster: paymentservice_cluster
                      timeout: 10s
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      # emailservice: listener :5000 (igual ao K8s service) → upstream pod :8080
      - name: emailservice_listener
        address:
          socket_address: { address: 0.0.0.0, port_value: 5000 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: emailservice
              codec_type: AUTO
              route_config:
                name: emailservice_route
                virtual_hosts:
                - name: emailservice
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    route:
                      cluster: emailservice_cluster
                      timeout: 10s
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      - name: recommendationservice_listener
        address:
          socket_address: { address: 0.0.0.0, port_value: 8080 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: recommendationservice
              codec_type: AUTO
              route_config:
                name: recommendationservice_route
                virtual_hosts:
                - name: recommendationservice
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    route:
                      cluster: recommendationservice_cluster
                      timeout: 10s
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      - name: adservice_listener
        address:
          socket_address: { address: 0.0.0.0, port_value: 9555 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: adservice
              codec_type: AUTO
              route_config:
                name: adservice_route
                virtual_hosts:
                - name: adservice
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    route:
                      cluster: adservice_cluster
                      timeout: 10s
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:

      - name: productcatalogservice_cluster
        type: STRICT_DNS
        lb_policy: LEAST_REQUEST
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options: {}
        load_assignment:
          cluster_name: productcatalogservice_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: productcatalogservice-headless.default.svc.cluster.local
                    port_value: 3550

      - name: cartservice_cluster
        type: STRICT_DNS
        lb_policy: LEAST_REQUEST
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options: {}
        load_assignment:
          cluster_name: cartservice_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: cartservice-headless.default.svc.cluster.local
                    port_value: 7070

      - name: checkoutservice_cluster
        type: STRICT_DNS
        lb_policy: LEAST_REQUEST
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options: {}
        load_assignment:
          cluster_name: checkoutservice_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: checkoutservice-headless.default.svc.cluster.local
                    port_value: 5050

      - name: currencyservice_cluster
        type: STRICT_DNS
        lb_policy: LEAST_REQUEST
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options: {}
        load_assignment:
          cluster_name: currencyservice_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: currencyservice-headless.default.svc.cluster.local
                    port_value: 7000

      - name: shippingservice_cluster
        type: STRICT_DNS
        lb_policy: LEAST_REQUEST
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options: {}
        load_assignment:
          cluster_name: shippingservice_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: shippingservice-headless.default.svc.cluster.local
                    port_value: 50051

      - name: paymentservice_cluster
        type: STRICT_DNS
        lb_policy: LEAST_REQUEST
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options: {}
        load_assignment:
          cluster_name: paymentservice_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: paymentservice-headless.default.svc.cluster.local
                    port_value: 50051

      # emailservice: upstream em :8080 (container port); K8s svc mapeia 5000→8080
      - name: emailservice_cluster
        type: STRICT_DNS
        lb_policy: LEAST_REQUEST
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options: {}
        load_assignment:
          cluster_name: emailservice_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: emailservice-headless.default.svc.cluster.local
                    port_value: 8080

      - name: recommendationservice_cluster
        type: STRICT_DNS
        lb_policy: LEAST_REQUEST
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options: {}
        load_assignment:
          cluster_name: recommendationservice_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: recommendationservice-headless.default.svc.cluster.local
                    port_value: 8080

      - name: adservice_cluster
        type: STRICT_DNS
        lb_policy: LEAST_REQUEST
        typed_extension_protocol_options:
          envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
            "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
            explicit_http_config:
              http2_protocol_options: {}
        load_assignment:
          cluster_name: adservice_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: adservice-headless.default.svc.cluster.local
                    port_value: 9555

# --- Deployment Envoy -------------------------------------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-grpc-lb
  namespace: default
  labels:
    app: envoy-grpc-lb
    scenario: c5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy-grpc-lb
  template:
    metadata:
      labels:
        app: envoy-grpc-lb
        scenario: c5
    spec:
      containers:
      - name: envoy
        image: envoyproxy/envoy:v1.33-latest
        imagePullPolicy: IfNotPresent
        args:
        - -c
        - /etc/envoy/envoy.yaml
        - --log-level
        - info
        ports:
        - name: productcatalog
          containerPort: 3550
        - name: cartservice
          containerPort: 7070
        - name: checkout
          containerPort: 5050
        - name: currency
          containerPort: 7000
        - name: shipping
          containerPort: 50051
        - name: payment
          containerPort: 50052
        - name: email
          containerPort: 5000
        - name: recommendation
          containerPort: 8080
        - name: adservice
          containerPort: 9555
        - name: admin
          containerPort: 9901
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: 9901
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /server_info
            port: 9901
          initialDelaySeconds: 10
          periodSeconds: 15
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
          readOnly: true
      volumes:
      - name: envoy-config
        configMap:
          name: envoy-grpc-lb-config
          items:
          - key: envoy.yaml
            path: envoy.yaml

# --- Service Envoy (ClusterIP) ----------------------------------------------
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-grpc-lb
  namespace: default
  labels:
    app: envoy-grpc-lb
    scenario: c5
spec:
  type: ClusterIP
  selector:
    app: envoy-grpc-lb
  ports:
  - name: productcatalog
    port: 3550
    targetPort: 3550
  - name: cartservice
    port: 7070
    targetPort: 7070
  - name: checkout
    port: 5050
    targetPort: 5050
  - name: currency
    port: 7000
    targetPort: 7000
  - name: shipping
    port: 50051
    targetPort: 50051
  - name: payment
    port: 50052
    targetPort: 50052
  - name: email
    port: 5000
    targetPort: 5000
  - name: recommendation
    port: 8080
    targetPort: 8080
  - name: adservice
    port: 9555
    targetPort: 9555
  - name: admin
    port: 9901
    targetPort: 9901
